[package]
name = "gameboost"
version = "0.1.0"
description = "GameBoost – ehrliche PC-Gaming-Optimierung für Windows"
edition = "2021"
rust-version = "1.77"

[lib]
name = "gameboost_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
os_info = { version = "3", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_Shell"] }

[profile.release]
# Kleine, schnelle Binärdatei – wichtig für eine Boost-App.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
